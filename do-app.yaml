name: claimguard-hackday
region: blr

services:
  - name: backend
    github:
      repo: shadowlink12621/hackday-2026
      branch: feat/frontend
      deploy_on_push: true
    # Build from the repository root so `backend.main:app` stays importable.
    source_dir: /
    environment_slug: python
    build_command: pip install -r backend/requirements.txt
    run_command: uvicorn backend.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        # Add the key in DigitalOcean's app environment settings.

static_sites:
  - name: frontend
    github:
      repo: shadowlink12621/hackday-2026
      branch: feat/frontend
      deploy_on_push: true
    source_dir: /frontend
    environment_slug: node-js
    build_command: npm run build
    output_dir: dist
    envs:
      - key: VITE_API_BASE_URL
        value: ${backend.PUBLIC_URL}
        scope: BUILD_TIME
        type: GENERAL
